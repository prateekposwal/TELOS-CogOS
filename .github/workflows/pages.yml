name: Deploy Dashboard
on:
  push:
    branches: [main]
    paths: ['telos/dashboard.html', 'telos/serve_dashboard.py']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: telos/
      - id: deployment
        uses: actions/deploy-pages@v4
