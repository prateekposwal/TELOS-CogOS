name: Invariant Gates

# The release gate: full suite + self-audit + axiom falsifiability +
# falsifiable theorems + cognitive health, run at full duration (make check).
# Kept separate from tests.yml (which is the fast multi-version test matrix).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest flask flask-cors websockets coverage

      - name: Release gate (make check)
        run: make check
