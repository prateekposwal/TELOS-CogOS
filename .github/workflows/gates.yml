name: Invariant Gates

# The release gate: full suite + self-audit + axiom falsifiability +
# falsifiable theorems + cognitive health, run at full duration (make check).
# Kept separate from tests.yml (which is the fast multi-version test matrix).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest flask flask-cors websockets coverage

      - name: Release gate (make check)
        run: make check

      - name: Capability gates
        run: |
          python telos/tools/tool_channel_scan.py --ci
          python telos/tools/tool_governance_eval.py --ci
          python telos/tools/memory_eval.py --ci
          python telos/tools/learning_curve.py --ci
          python telos/tools/learning_env.py --ci
          python telos/tools/capability_scorecard.py --ci

      - name: Sustained memory consumption
        run: python telos/tools/memory_consumption_run.py --cycles 120 --ci

      # Behavioral harnesses: functional invariants + seeded determinism (no
      # wall-clock gates). Each exits nonzero on any missed criterion.
      - name: Behavioral evaluation harnesses
        run: make behavioral

      # Bounded strict stability gate (2000 cycles). STRICT: a load-skipped
      # check reports INCOMPLETE and exits 2 — CI never reads a skip as green.
      # The full 10,000-cycle strict run lives in nightly.yml.
      - name: Stability endurance gate (bounded, strict)
        run: make endurance

      - name: Packaging smoke (editable install + CLI)
        run: |
          pip install -e .
          telos --version
          python -m telos --help
