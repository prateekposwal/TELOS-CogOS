name: Nightly Gap Scan

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:      # manual trigger

jobs:
  gap-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install numpy pytest
      - name: Self-audit
        run: |
          PYTHONPATH=. python3 telos/tools/self_audit.py | tee audit.log
          echo "EXIT=$?" >> $GITHUB_ENV
      - name: Gap scanner
        run: |
          python3 telos/tools/gap_scanner.py | tee gap.log
      - name: Dependency graph
        run: |
          python3 telos/tools/dependency_graph.py | tee deps.log
      - name: Run tests
        run: |
          PYTHONPATH=. python3 -m pytest tests/ -q --tb=no 2>&1 | tee test.log
      # Full-duration stability gate (STRICT). pipefail makes the step's exit
      # code the harness's: a load-skipped checklist => INCOMPLETE => exit 2,
      # so a nightly can never pass on an unmeasured run. Nightly runners are
      # quiet, so the load guard should not trip; if one does, the run is
      # correctly non-green rather than a false PASS.
      - name: Stability endurance gate (full 10k, strict)
        run: |
          set -o pipefail
          PYTHONPATH=. python3 telos/tools/endurance.py --cycles 10000 --strict 2>&1 | tee endurance.log
      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: scan-logs
          path: '*.log'

  deploy:
    needs: gap-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: telos/
      - id: deployment
        uses: actions/deploy-pages@v4
